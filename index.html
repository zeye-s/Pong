                </tr>

                    <td><Button>PlaceHolder</Button><br><img src = "" alt = "Player 1 Ability 1" width = "100" height = "100"></td>
                    <td>PlaceHolder</td>
                </tr>
                <tr>
                    <td><Button>PlaceHolder</Button><br><img src = "" alt = "Player 1 Ability 2" width = "100" height = "100"></td>
                    <td>PlaceHolder</td>
                </tr>
                <tr>

                    <td>PlaceHolder</td>
                </tr>
            </Table>
        </div>

        <div id = "scoreBoard">
            <h1>Scores</h1>
            <h2 id = "scoreText">0 : 0</h2>
        </div>
        <div id = "startreset">
        <button id = "start">Start</button>

        <button id = "reset"> Reset</button>
        </div>
    </div>
    <script src = "index.js"></script>
</body>
</html>
