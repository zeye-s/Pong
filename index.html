<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel = "stylesheet" href = "styles.css">
</head>
<body>
    <div id = "gameBoardContainer">
        <h1>Welcome To Pong<a href = "Guide.html"> <img src = "img/Question_mark_white.png" width = "25px" height = "25px"></a></h1>
        
        <div id = "AbilitySelector">
            <Table id = "player1Abilities">
                <tr>
                    <th><h1>Player 1 Abilities</h1></th>
                </tr>
                <tr>
                    <td><Button id = "P1A1" class = "P1">Time Lord</Button><br><br><img src = "img/clock.jpg" alt = "Player 1 Ability 1" width = "175" height = "100"></td>
                </tr>
                <tr>
                    <td><Button id = "P1A2" class = "P1">Frost Zone</Button><br><br><img src = "img/frost.jpg" alt = "Player 1 Ability 2" width = "175" height = "100"></td>
                </tr>
                <tr>
                    <td><Button id = "P1A3" class = "P1">Flame Frenzy</Button><br><br><img src = "img/flame.jpg" alt = "Player 1 Ability 3" width = "200" height = "110"></td>
                </tr>
                <tr>
                    <td>Ability Status:  <div id = "P1Status">Ready</div>
                    <br><div class = "barContainer"><div class = "cooldownBar" id = "player1Bar"></div></div>
                    </td>
                    
                </tr>
            </Table>
            <canvas id = "gameBoard" width= "500" height =  "500"></canvas>
            <Table id = "player2Abilities">
                <tr>
                    <th><h1>Player 2 Abilities</h1></th>
                </tr>
                <tr>
                    <td><Button id = "P2A1" class = "P2">Bastion</Button><br><br><img src = "img/shield.jpg" alt = "Player 2 Ability 1" width = "175" height = "100"></td>
                </tr>
                <tr>
                    <td><Button id = "P2A2" class = "P2">Dai Ichi No Bakudan</Button><br><br><img src = "img/bomb.jpg" alt = "Player 2 Ability 2" width = "175" height = "100"></td>
                </tr>
                <tr>
                    <td><Button id = "P2A3" class = "P2">Determination</Button><br><br><img src = "img/checkpoint.jpg" alt = "Player 2 Ability 3" width = "175" height = "100"></td>
                </tr>
                <tr>
                    <td>Ability Status:  <div id = "P2Status">Ready</div>
                    <br><div class = "barContainer"><div class = "cooldownBar" id = "player2Bar"></div></td></div>
                </tr>

            </Table>
        </div>

        <div id = "scoreBoard">
            <h1>Scores</h1>
            <h2 id = "scoreText">0 : 0</h2>
        </div>
        <div id = "startreset">
        <button id = "start">Start</button>

        <button id = "reset"> Reset</button>
        </div>
    </div>
    <script src = "index.js"></script>
</body>
</html>
